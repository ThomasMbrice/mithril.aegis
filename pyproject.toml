[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Adaptive, Escalating, Graded Infrastructure Survivability — blast-radius-aware fault-tolerance runtime for LLM training & serving"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "numpy>=1.26,<2", "torch>=2.2", "transformers>=4.40"]

[project.scripts]
aegis = "aegis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
log_cli = true
log_cli_level = "WARNING"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*", "chaos_inject*", "realbench*"]
