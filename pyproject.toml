[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import package remains `aegis`
# (`import aegis`); only the pip/PyPI name is namespaced to avoid the
# already-taken bare `aegis` distribution.
name = "mithril_aegis"
version = "0.1.0"
description = "Adaptive, Escalating, Graded Infrastructure Survivability — blast-radius-aware fault-tolerance runtime for LLM training & serving"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "numpy>=1.26,<2", "torch>=2.2", "transformers>=4.40"]

# AEGIS ships as an in-process library. `aegis/cli.py` remains as an
# experimental torchrun drop-in but is intentionally NOT exposed as a console
# script yet — the thin wrapper adds no fault-tolerance on its own (your
# training script must still call `aegis.init()`), so shipping it as a command
# would over-promise. Re-add a `[project.scripts]` entry once the CLI actually
# injects `aegis.init()` around the launch.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
log_cli = true
log_cli_level = "WARNING"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*", "chaos_inject*", "realbench*"]
