name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test_outcome: ${{ steps.pytest.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only torch for speed)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: pytest --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

      - name: Report results to Google Sheets
        if: always()
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install gspread google-auth
          python scripts/ci/report_to_sheets.py \
            --junit-xml test-results.xml \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "$RUN_URL"

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # Distribution-level guard for the library-only release: build the real
  # sdist + wheel and assert the artifact ships no console script. Torch-free,
  # so it stays fast and verifies packaging independently of the test job.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert wheel ships no console scripts (library-only)
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if n.endswith("entry_points.txt")]
          assert not bad, f"wheel unexpectedly ships entry points: {bad}"
          print(f"OK: {whl} contains no entry_points.txt")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 14

  # Publish the built sdist + wheel to PyPI via twine. Runs only on pushes to
  # main, and only after both the test and package jobs pass, so tagged/merged
  # commits are the only thing that can reach the index. Reuses the exact
  # artifact the `package` job already built and validated.
  publish:
    needs: [test, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to PyPI with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip twine
          twine upload --non-interactive dist/*
